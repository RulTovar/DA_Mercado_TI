<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Analysis · Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #fff;
      --surface:   #122e34;
      --border:    #122e34;
      --accent:    #127e96;
      --text:      #1e272e;
      --text-dim:  #3e5061;
      --font-display: 'Space Grotesk', sans-serif;
      --font-body:    'Inter', sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 48px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(18,46,52,0.1);
    }

    .nav-logo {
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    .nav-logo span { color: var(--accent); }

    .nav-author {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .nav-cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 22px;
      background: var(--accent);
      color: #fff;
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
      transition: opacity 0.2s, transform 0.2s;
    }
    .nav-cta:hover { opacity: 0.85; transform: translateY(-1px); }
    .nav-cta svg { transition: transform 0.2s; }
    .nav-cta:hover svg { transform: translateX(3px); }

    /* ── DASHBOARD SECTION ── */
    .section-dashboard {
      padding: 96px 48px 80px;
      max-width: 1280px;
      margin: 0 auto;
    }

    .section-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .section-label {
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .section-title {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .section-meta {
      font-size: 12px;
      color: var(--text-dim);
      text-align: right;
      line-height: 1.6;
    }

    /* ── DASHBOARD FRAME ── */
    .dashboard-frame {
      border: 1px solid var(--border);
      overflow: hidden;
    }

    /* browser chrome bar */
    .frame-chrome {
      background: var(--surface);
      padding: 11px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .chrome-dots { display: flex; gap: 6px; }
    .chrome-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
    }
    .chrome-url {
      flex: 1;
      background: rgba(255,255,255,0.08);
      border-radius: 3px;
      padding: 4px 12px;
      font-size: 11px;
      color: rgba(255,255,255,0.45);
      font-family: var(--font-body);
    }
    .chrome-url span { color: rgba(255,255,255,0.75); }

    .embed-container {
      width: 100%;
    }

    /* scan-line reveal */
    .scan-overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      background: var(--surface);
      pointer-events: none;
      animation: scanReveal 1.6s cubic-bezier(0.77, 0, 0.18, 1) 0.3s forwards;
    }
    .scan-line {
      position: absolute;
      left: 0; right: 0;
      height: 2px;
      background: linear-gradient(to right, transparent, var(--accent), transparent);
      box-shadow: 0 0 16px var(--accent);
      animation: scanLine 1.6s cubic-bezier(0.77, 0, 0.18, 1) 0.3s forwards;
      opacity: 0;
    }
    @keyframes scanReveal {
      0%   { transform: scaleY(1); transform-origin: top; }
      100% { transform: scaleY(0); transform-origin: top; opacity: 0; }
    }
    @keyframes scanLine {
      0%   { top: 0; opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    /* caption bar */
    .frame-caption {
      border-top: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      background: #f8fbfc;
    }
    .caption-tags { display: flex; gap: 8px; flex-wrap: wrap; }
    .tag {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 4px 10px;
      border: 1px solid rgba(18,46,52,0.2);
      color: var(--text-dim);
    }
    .tag.accent { border-color: var(--accent); color: var(--accent); }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      nav { padding: 16px 24px; gap: 12px; }
      .nav-author { display: none; }
      .section-dashboard { padding: 80px 20px 60px; }
      .section-header { flex-direction: column; align-items: flex-start; }
      .section-meta { text-align: left; }
    }

    @media (prefers-reduced-motion: reduce) {
      .scan-overlay, .scan-line { animation: none; opacity: 0; }
    }
  </style>
</head>
